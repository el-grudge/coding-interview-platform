services:
  # Web service for the full-stack application
  - type: web
    name: coding-interview-platform
    env: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/v1/health
